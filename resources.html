
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resources | Sherlynette Pérez Castro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <a class="brand" href="index.html">
      Sherlynette Pérez Castro
      <small>MICROBIAL ECOLOGY · BIOGEOCHEMISTRY</small>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="resources.html">Resources</a>
      <a href="cv.pdf" target="_blank" rel="noopener">CV ↗</a>
    </nav>
  </header>

  <main class="catalog">
    <div class="prompt">
      sherly@research:~/resources $ ls --catalog
    </div>

    <div class="catalog-toolbar">
      <input
        id="resource-search"
        type="search"
        placeholder="Search tools, databases, references…"
        aria-label="Search resources"
      >

      <div class="filters" role="group" aria-label="Filter resources">
        <button class="active" data-filter="all">All</button>
        <button data-filter="databases">Databases</button>
        <button data-filter="bioinformatics">Bioinformatics</button>
        <button data-filter="references">Standards &amp; References</button>
        <button data-filter="visualization">Visualization</button>
      </div>
    </div>

    <div class="resource-grid" id="resource-grid"></div>

    <p class="muted-note">
      Edit <code>resources.js</code> to add or change cards.
    </p>
  </main>

  <script src="resources.js"></script>

  <footer>
    © Sherlynette Pérez Castro
  </footer>
</body>
</html>
